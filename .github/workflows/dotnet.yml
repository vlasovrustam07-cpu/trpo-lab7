name: .NET CI  # Сборка и тесты при push и Pull Request в main

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore  # здесь видны предупреждения компилятора и StyleCop

    - name: Test
      run: dotnet test --no-build --verbosity normal
